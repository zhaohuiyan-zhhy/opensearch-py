  - target: "$.paths['/_cat/repositories']"
    remove: true
  - target: "$.paths['/_cat/segment_replication']"
    remove: true
  - target: "$.paths['/_cat/segment_replication/{index}']"
    remove: true
  - target: "$.paths['/_cat/segments']"
    remove: true
  - target: "$.paths['/_cat/segments/{index}']"
    remove: true
  - target: "$.paths['/_cat/shards']"
    remove: true
  - target: "$.paths['/_cat/shards/{index}']"
    remove: true
  - target: "$.paths['/_cat/snapshots']"
    remove: true
  - target: "$.paths['/_cat/snapshots/{repository}']"
    remove: true
  - target: "$.paths['/_cat/tasks']"
